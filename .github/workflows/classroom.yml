
name: GitHub Classroom Workflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start application and database
        run: docker compose up --build -d

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/openapi.json > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"
          docker compose logs
          exit 1

      - name: Install Newman
        run: npm install -g newman

      - name: Run API Tests
        run: |
          newman run "postman/[inst] Lab1.postman_collection.json" \
            -e "postman/[inst][local] Lab1.postman_environment.json" \
            --delay-request 100

      - name: Stop containers
        if: always()
        run: docker compose down -v

