version: "3.8"
services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://program:test@db:5432/persons
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: program
      POSTGRES_PASSWORD: test
      POSTGRES_DB: persons
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
